<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
  <title id="title">IO 편집기 에디터 헤더 상태 와이어프레임</title>
  <desc id="desc">정상, 경고, 오류 상태의 에디터 헤더를 비교하고 IO 전체 이름, IO 논리 이름, 상태 아이콘과 상태 메시지를 번호로 구분한 와이어프레임</desc>
  <defs>
    <style>
      .page { fill: #f4f4f4; }
      .surface { fill: #ffffff; stroke: #555555; stroke-width: 2; }
      .state-label { fill: #333333; font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .title { fill: #222222; font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; }
      .warning-message { fill: #9a6700; font-family: Arial, sans-serif; font-size: 20px; }
      .error-message { fill: #c62828; font-family: Arial, sans-serif; font-size: 20px; }
      .number { fill: #d52b2b; stroke: #ffffff; stroke-width: 4; }
      .number-text { fill: #ffffff; font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .warning-icon { fill: #f2b600; stroke: #9a6700; stroke-width: 2; }
      .error-icon { fill: #d93636; }
      .icon-text { fill: #ffffff; font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect class="page" width="1400" height="500"/>

  <!-- 정상 상태 -->
  <text class="state-label" x="45" y="99">정상</text>
  <rect class="surface" x="145" y="45" width="1210" height="90" rx="6"/>
  <text class="title" x="185" y="101">com.example.MyIO</text>
  <text class="title" x="400" y="101">(Logical Name)</text>
  <circle class="number" cx="190" cy="55" r="20"/>
  <text class="number-text" x="190" y="55">1</text>
  <circle class="number" cx="404" cy="55" r="20"/>
  <text class="number-text" x="404" y="55">2</text>

  <!-- 경고 상태 -->
  <text class="state-label" x="45" y="249">경고</text>
  <rect class="surface" x="145" y="195" width="1210" height="90" rx="6"/>
  <polygon class="warning-icon" points="188,222 207,258 169,258"/>
  <text class="icon-text" x="188" y="247">!</text>
  <text class="title" x="230" y="251">com.example.MyIO</text>
  <text class="warning-message" x="520" y="251">논리 이름을 입력 하십시오.</text>
  <circle class="number" cx="170" cy="205" r="20"/>
  <text class="number-text" x="170" y="205">3</text>
  <circle class="number" cx="520" cy="205" r="20"/>
  <text class="number-text" x="520" y="205">4</text>

  <!-- 오류 상태 -->
  <text class="state-label" x="45" y="399">오류</text>
  <rect class="surface" x="145" y="345" width="1210" height="90" rx="6"/>
  <circle class="error-icon" cx="188" cy="390" r="18"/>
  <text class="icon-text" x="188" y="391">×</text>
  <text class="title" x="230" y="401">com.example.MyIO(Logical Name)</text>
  <text class="error-message" x="655" y="401">필드 이름을 입력 하십시오.</text>
</svg>
